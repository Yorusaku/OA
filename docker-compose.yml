version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: panorama-oa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: panorama_oa
    ports:
      - '5434:5432'
    volumes:
      - panorama_oa_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d panorama_oa']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  panorama_oa_pg_data:
